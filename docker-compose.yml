services:
  db:
    image: pgvector/pgvector:pg16
    container_name: gigabyte-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: gigabyte
      POSTGRES_PASSWORD: gigabyte
      POSTGRES_DB: gigabyte_agent
    ports:
      - "5432:5432"
    volumes:
      - gigabyte_db_data:/var/lib/postgresql/data
      - ./backend/scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gigabyte -d gigabyte_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    container_name: gigabyte-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - gigabyte_ollama_data:/root/.ollama
    # GPU passthrough so inference actually runs on the GPU instead of CPU
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  backend:
    build: ./backend
    container_name: gigabyte-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: qwen3:4b-instruct
      OLLAMA_EMBED_MODEL: nomic-embed-text
      DATABASE_URL: postgresql+asyncpg://gigabyte:gigabyte@db:5432/gigabyte_agent
      DATABASE_URL_SYNC: postgresql://gigabyte:gigabyte@db:5432/gigabyte_agent
      MAX_REACT_STEPS: 6
      LLM_TEMPERATURE: 0.2
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    # GPU passthrough for the /ws/system hardware panel (pynvml)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  frontend:
    build: ./frontend
    container_name: gigabyte-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  gigabyte_db_data:
  gigabyte_ollama_data:
