services:
  db:
    image: pgvector/pgvector:pg16
    container_name: gigabyte-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: gigabyte
      POSTGRES_PASSWORD: gigabyte
      POSTGRES_DB: gigabyte_agent
    ports:
      - "5432:5432"
    volumes:
      - gigabyte_db_data:/var/lib/postgresql/data
      - ./backend/scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gigabyte -d gigabyte_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    container_name: gigabyte-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - gigabyte_ollama_data:/root/.ollama
    # GPU passthrough so inference actually runs on the GPU instead of CPU
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  backend:
    build: ./backend
    container_name: gigabyte-backend
    restart: unless-stopped
    # Run tini as PID 1 instead of uvicorn directly: this container's PID 1
    # gets a permanently broken NVML handle under Docker Desktop/WSL2 GPU
    # passthrough (see routes_ws_system.py's _gpu_status comment) - vLLM's
    # own in-process pynvml.nvmlInit() call during model-architecture
    # inspection hits the same bug otherwise ("NVMLError_NotSupported").
    init: true
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
    environment:
      VLLM_MODEL: Qwen/Qwen3-8B-AWQ
      VLLM_QUANTIZATION: awq
      # Tried raising this to 0.92 to fit an 8192-token context, but vLLM's
      # own startup check reported only 6.87/7.96GiB free on this GPU before
      # the engine even loads (~1.09GiB is already used by something outside
      # the container - host display/other processes) - 0.92 (7.32GiB
      # requested) OOM'd immediately. 0.85 is the known-good value verified
      # to actually start.
      VLLM_GPU_MEMORY_UTILIZATION: 0.85
      VLLM_ENFORCE_EAGER: true
      # This laptop's RTX 5060 is sm_120 (Blackwell) - FlashAttention's
      # prebuilt kernels hang on it during model load. Triton's attention
      # backend compiles at runtime for whatever architecture it finds, so
      # it isn't tied to a fixed set of precompiled SM targets. vLLM 0.27.1
      # has no VLLM_ATTENTION_BACKEND env var (removed upstream) - this is
      # read by config.py and threaded into AsyncEngineArgs in llm.py instead.
      VLLM_ATTENTION_BACKEND: TRITON_ATTN
      # Docker Desktop/WSL2 disables pinned memory by default, which vLLM's
      # v2 GPU model runner needs for its UVA buffers - without this it fails
      # to start with "RuntimeError: UVA is not available".
      VLLM_WSL2_ENABLE_PIN_MEMORY: 1
      # flashinfer's top_k/top_p sampler JIT-compiles a CUDA kernel via nvcc
      # at first use - this image has no CUDA toolkit (only the driver's
      # libcuda.so via GPU passthrough), so that JIT fails with "Could not
      # find nvcc". Falling back to vLLM's native PyTorch sampler avoids it.
      VLLM_USE_FLASHINFER_SAMPLER: 0
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_EMBED_MODEL: nomic-embed-text
      # Cross-encoder rerank stays on CPU - see VLLM_GPU_MEMORY_UTILIZATION
      # note above, the GPU has no headroom left for a second model.
      RERANK_ENABLED: true
      RERANK_MODEL: BAAI/bge-reranker-base
      RERANK_DEVICE: cpu
      RERANK_CANDIDATE_K: 20
      # huggingface_hub's newer "Xet" chunked-transfer backend hangs
      # indefinitely mid-download under this Docker/WSL2 network setup
      # (observed: model.safetensors download stalls partway through and
      # never resumes). Forces the classic HTTP download path instead, which
      # is slower per-byte but actually completes.
      HF_HUB_DISABLE_XET: 1
      DATABASE_URL: postgresql+asyncpg://gigabyte:gigabyte@db:5432/gigabyte_agent
      DATABASE_URL_SYNC: postgresql://gigabyte:gigabyte@db:5432/gigabyte_agent
      MAX_REACT_STEPS: 6
      LLM_TEMPERATURE: 0.2
      # This laptop's RTX 5060 only has 8GB VRAM, and only ~6.87GiB of that
      # is actually free before vLLM even starts (confirmed via vLLM's own
      # startup memory check - ~1.09GiB is used by something outside the
      # container). At gpu_memory_utilization 0.85 that leaves ~0.66GiB for
      # KV cache, putting vLLM's own ceiling at ~4800 tokens - 8192 is not
      # reachable on this hardware without KV-cache quantization (fp8) or
      # freeing host-side GPU memory. 4608 fits with a bit of headroom.
      LLM_NUM_CTX: 4608
      LLM_MAX_TOKENS: 2048
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    volumes:
      # Persist the downloaded HF model weights (~8GB) across container
      # restarts/rebuilds instead of re-downloading every time.
      - gigabyte_hf_cache:/root/.cache/huggingface
    # GPU passthrough: vLLM's AsyncLLMEngine now loads the generation model
    # directly into this container's GPU (also used by /ws/system's pynvml)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  frontend:
    build: ./frontend
    container_name: gigabyte-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  gigabyte_db_data:
  gigabyte_ollama_data:
  gigabyte_hf_cache:
